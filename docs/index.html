<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Just a tool for the original game Poco">
    <meta name="author" content="fantasma">
    <title>Pocoスコアカウンター</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    
    <meta property="og:title" content="Pocoスコアカウンター">
    <meta property="og:description" content="Just a tool for the original game Poco">
    <meta property="og:site_name" content="✊✌️🖐️ Pocoスコアカウンター">
    <meta property="og:url" content="https://10thgrade.github.io/PocoManager/">
    <meta name="twitter:card" content="summary">
</head>

<body>
    <header>
        <h1>✊✌️🖐️ Pocoスコアカウンター</h1>
        <div class="score">得点: <span id="total">0</span> 点</div>
        <div class="aiko-info">
            Aiko宣言 残り <span id="aikoLeft">2</span> 回
            <button onclick="declareAiko()">宣言</button>
        </div>
    </header>

    <div class="history" id="history"></div>

    <div class="buttons">
        <div class="hand-buttons">
            <button class="hand-btn gu" onclick="selectHand('👊 グー', this)">👊</button>
            <button class="hand-btn choki" onclick="selectHand('✌️ チョキ', this)">✌️</button>
            <button class="hand-btn pa" onclick="selectHand('🖐️ パー', this)">🖐️</button>
        </div>
        <div class="result-buttons">
            <button class="result-btn win" onclick="selectResult('勝ち')" disabled>勝ち</button>
            <button class="result-btn lose" onclick="selectResult('負け')" disabled>負け</button>
            <button class="result-btn draw" onclick="selectResult('あいこ')" disabled>あいこ</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
